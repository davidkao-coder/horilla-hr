{% extends 'index.html' %}
{% load static %}
{% block content %}
{% load i18n %}

{# Think4U: 改為樹狀結構，不再需要 orgChart.js / .css #}

<main :class="sidebarOpen ? 'oh-main__sidebar-visible' : ''">
    <section class="oh-wrapper oh-main__topbar" x-data="{searchShow: false}">
        <div class="oh-main__titlebar oh-main__titlebar--left">
            <h1 class="oh-main__titlebar-title fw-bold">{% trans "Organization Chart" %}</h1>
        </div>
        <div class="oh-main__titlebar oh-main__titlebar--right">
            <div class="oh-input-group oh-input__search-group"
                :class="searchShow ? 'oh-input__search-group--show' : ''">
                <ion-icon name="search-outline" class="oh-input-group__icon oh-input-group__icon--left"></ion-icon>
                <input type="text" class="oh-input oh-input__icon" aria-label="Search Input" placeholder="{% trans '搜尋名稱…' %}"
                    id="t4u-tree-search" oninput="t4uTreeFilter(this.value);" />
            </div>
        </div>
    </section>
    <div class="oh-wrapper" id="chart_target">
        {# 直接 server-side render 樹，不需要 htmx 再 POST #}
        {% include 'organisation_chart/chart.html' %}
    </div>
</main>

<script>
    // 樹狀搜尋：依姓名 / 職位即時過濾，並自動展開父節點
    function t4uTreeFilter(keyword) {
        keyword = (keyword || '').trim().toLowerCase();
        var items = document.querySelectorAll('.t4u-tree__item');
        if (!keyword) {
            items.forEach(function (li) { li.style.display = ''; });
            return;
        }
        // 先全部隱藏
        items.forEach(function (li) { li.style.display = 'none'; });
        // 找出 match 的節點，把它+所有上層父節點都顯示
        items.forEach(function (li) {
            var label = li.querySelector('.t4u-tree__summary, .t4u-tree__leaf');
            if (!label) return;
            if (label.textContent.toLowerCase().indexOf(keyword) !== -1) {
                li.style.display = '';
                var parent = li.parentElement;
                while (parent && !parent.classList.contains('t4u-tree-wrapper')) {
                    if (parent.classList.contains('t4u-tree__item')) {
                        parent.style.display = '';
                        var details = parent.querySelector(':scope > .t4u-tree__details');
                        if (details) details.open = true;
                    }
                    parent = parent.parentElement;
                }
            }
        });
    }
</script>
{% endblock %}
