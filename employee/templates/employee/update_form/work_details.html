{% load i18n %}
<div class="oh-wrapper">
  <div
    class="oh-general__tab-target oh-profile-section mb-4 d-none"
    id="work"
    data-select2-id="select2-data-work"
  >
    <div
      class="oh-modal"
      id="dynamicCreateModal"
      role="dialog"
      aria-hidden="true"
    >
      <div
        class="oh-modal__dialog"
        style="max-width: 550px"
        id="dynamicCreateModalBody"
      ></div>
    </div>
    <span
      name=""
      id="dynamicDept"
      style="display: none"
      data-toggle="oh-modal-toggle"
      data-target="#dynamicCreateModal"
      hx-get="{% url 'department-creation' %}?dynamic=true"
      hx-target="#dynamicCreateModalBody"
    ></span>
    <span
      name=""
      id="dynamicJobPosition"
      style="display: none"
      data-toggle="oh-modal-toggle"
      data-target="#dynamicCreateModal"
      hx-get="{% url 'job-position-creation' %}?dynamic=true"
      hx-target="#dynamicCreateModalBody"
    ></span>
    <span
      name=""
      id="dynamicJobRole"
      style="display: none"
      data-toggle="oh-modal-toggle"
      data-target="#dynamicCreateModal"
      hx-get="{% url 'job-role-create' %}?dynamic=true"
      hx-target="#dynamicCreateModalBody"
    ></span>
    <span
      name=""
      id="dynamicWorkType"
      style="display: none"
      data-toggle="oh-modal-toggle"
      data-target="#dynamicCreateModal"
      hx-get="{% url 'work-type-create' %}?dynamic=true"
      hx-target="#dynamicCreateModalBody"
    ></span>
    <span
      name=""
      id="dynamicEmployeeType"
      style="display: none"
      data-toggle="oh-modal-toggle"
      data-target="#dynamicCreateModal"
      hx-get="{% url 'employee-type-create' %}?dynamic=true"
      hx-target="#dynamicCreateModalBody"
    ></span>
    <span
      name=""
      id="dynamicShift"
      style="display: none"
      data-toggle="oh-modal-toggle"
      data-target="#dynamicCreateModal"
      hx-get="{% url 'employee-shift-create' %}?dynamic=true"
      hx-target="#dynamicCreateModalBody"
    ></span>
    <div
      class="oh-profile-section__card"
      data-select2-id="select2-data-29-vht3"
    >
      <div id="workMessage"></div>
      <form method="post" action="">
        <input type="hidden" name="form" value="work">
        {% if work_info_history %}
          {{history_form.as_history_modal}}
        {% endif %}
        {% csrf_token %}
        {{work_form.as_p}}
        <hr class="mt-5 mb-3" />
        <div class="w-100 d-flex align-items-center justify-content-end">
          <button
            type="submit"
            class="oh-btn oh-btn--secondary oh-btn--w-100-resp"
          >
            {% trans "Save" %}
          </button>
        </div>
      </form>
      {# Think4U: 健保眷屬明細（加保）— HTMX 載入，獨立於工作資訊表單 #}
      {% if obj_id %}
      <hr class="mt-4 mb-3" />
      <div hx-get="{% url 'think4u-dependent-section' obj_id %}" hx-trigger="load"></div>
      {% endif %}
    </div>
  </div>
</div>
<script>
  function onDynamicCreate(value, id) {
    if (value === "create") {
      $(id).click();
      return;
    }

    let url, dropdownId, createText, emptyText;
    const data =
      id === "#dynamicDept" ? { department_id: value } : { job_id: value };

    if (id === "#dynamicDept") {
      url = '{% url "get-job-positions" %}';
      dropdownId = "#id_job_position_id";
      createText = "Create New Job Position";
      emptyText = "---Choose Job Position---";
      $("#id_job_role_id").html(
        '<option value="">---Choose Job Role---</option>'
      );
    } else if (id === "#dynamicJobPosition") {
      url = '{% url "get-job-roles" %}';
      dropdownId = "#id_job_role_id";
      createText = "Create New Job Role";
      emptyText = "---Choose Job Role---";
    }

    if (value) {
      $.ajax({
        url: url,
        method: "GET",
        data: data,
        success: function (data) {
          const dropdown = $(dropdownId);
          const options = [`<option value="">${emptyText}</option>`];

          $.each(data.job_positions || data.job_roles, function (key, value) {
            options.push(`<option value="${key}">${value}</option>`);
          });

          options.push(`<option value="create">${createText}</option>`);
          dropdown.html(options.join(""));
        },
      });
    } else {
      const resetOptions = `<option value="">${emptyText}</option><option value="create">${createText}</option>`;
      $(dropdownId).html(resetOptions);

      if (id === "#dynamicDept") {
        $("#id_job_role_id").append(
          $("<option>", {
            value: "create",
            text: "Create New Job Role",
          })
        );
      }
    }
  }
</script>

<script>
  /*
   * Think4U FIX: 原 Horilla 程式在 doc.ready 會 $('#id_job_position_id').empty()
   * 再用 AJAX 重建 options，但沒有觸發 select2 refresh，造成 select2 顯示為空。
   * 加上我們已移除 job_role_id 欄位，那段邏輯整批會出錯。
   *
   * 新邏輯：
   *  - 利用 server 端已渲染好的所有職位（label 已含部門名）作為初始值
   *  - 員工存檔時不再依賴 doc.ready cascade
   *  - 但仍提供 onchange 過濾：使用者改部門 → 即時過濾職位 dropdown
   *  - 任何重建後一律 trigger select2 refresh
   */
  $(document).ready(function () {
    function refreshSelect2($el) {
      if ($el.hasClass("oh-select-2") || $el.hasClass("select2-hidden-accessible")) {
        try { $el.trigger("change.select2"); } catch (e) {}
      }
    }

    // Cache 一份「全部職位」（含部門 label）以便 reset
    var $pos = $("#id_job_position_id");
    var allPositionOptions = [];
    $pos.find("option").each(function () {
      var v = $(this).attr("value");
      var t = $(this).text();
      if (v === "" || v === "create") return;
      allPositionOptions.push({
        value: v,
        text: t,
        // 解析 "職位名 - (部門名)" 取得部門名
        dept: (t.match(/\(([^)]+)\)\s*$/) || [])[1] || null,
      });
    });

    // 監聽部門變更 → 過濾職位
    $("#id_department_id").on("change.t4uDeptFilter", function () {
      var deptText = $(this).find("option:selected").text().trim();
      var currentVal = $pos.val();
      $pos.find("option").each(function () {
        var v = $(this).attr("value");
        if (v === "" || v === "create") return;
        $(this).remove();
      });
      // 重新塞入「該部門」的職位（若 deptText 找得到的話）
      var matched = allPositionOptions.filter(function (o) {
        return !deptText || o.dept === deptText;
      });
      matched.forEach(function (o) {
        $pos.append($("<option>", { value: o.value, text: o.text }));
      });
      // 若先前選擇仍在新清單裡就保留，否則清空
      var stillValid = matched.some(function (o) {
        return String(o.value) === String(currentVal);
      });
      $pos.val(stillValid ? currentVal : "");
      refreshSelect2($pos);
    });

    // 初次載入：若已有部門，立即過濾一次
    if ($("#id_department_id").val()) {
      $("#id_department_id").trigger("change.t4uDeptFilter");
    }
  });
</script>
