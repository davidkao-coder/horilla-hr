{% load i18n %}
{# Think4U: 篩選器精簡 — 工作資訊只留員工，進階只留起始/截止日期 #}
<div class="oh-dropdown__filter-body">
    <input type="hidden" value="{{request.GET.id}}" name="id">
    <div class="oh-accordion">
      <div class="oh-accordion-header"
        onclick="event.stopImmediatePropagation();$(this).parent().toggleClass('oh-accordion--show');">
        {% trans "Work Info" %}
      </div>
      <div class="oh-accordion-body">
        <div class="row">
          <div class="col-sm-12 col-md-12 col-lg-12">
            <div class="oh-input-group">
              <label class="oh-label">{% trans "Employee" %}</label>
              {{form.employee_id}}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="oh-accordion">
      <div class="oh-accordion-header"
        onclick="event.stopImmediatePropagation();$(this).parent().toggleClass('oh-accordion--show');">
        {% trans "Advanced" %}
      </div>
      <div class="oh-accordion-body">
        <div class="row">
          <div class="col-sm-12 col-md-12 col-lg-6">
            <div class="oh-input-group">
              <label class="oh-label">{% trans "起始日期" %}</label>
              {{form.from_date}}
            </div>
          </div>
          <div class="col-sm-12 col-md-12 col-lg-6">
            <div class="oh-input-group">
              <label class="oh-label">{% trans "截止日期" %}</label>
              {{form.to_date}}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="oh-dropdown__filter-footer">
    <button class="oh-btn oh-btn--secondary oh-btn--small w-100 filterButton" type="submit">
      {% trans "Filter" %}
    </button>
  </div>
