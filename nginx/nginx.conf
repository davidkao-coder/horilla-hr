# Think4U HRMS — Nginx 設定
# HTTP → HTTPS redirect + reverse proxy to gunicorn

upstream think4u_app {
    server server:8000;
}

server {
    listen 80;
    server_name _;

    # 健康檢查不轉發 https（內部監控用）
    location = /health/ {
        proxy_pass http://think4u_app;
        proxy_set_header Host $host;
    }

    # 其餘全 redirect 至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL 憑證（請替換為實際路徑或用 certbot 自動化）
    ssl_certificate     /etc/nginx/ssl/think4u.crt;
    ssl_certificate_key /etc/nginx/ssl/think4u.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20m;

    # 靜態檔案
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # 主應用
    location / {
        proxy_pass http://think4u_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
