# Think4U HRMS — 系統 nginx site 設定（Ubuntu 主機，與 app 同機）
# 安裝：
#   sudo cp deploy/nginx-hrms.conf /etc/nginx/sites-available/hrms
#   sudo ln -sf /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS（自動改寫本檔加上 443/憑證/80→443 導向）：
#   sudo certbot --nginx -d hrms.think4u-tech.com
#   （前提：路由器 80/443 已轉發到本機 192.168.2.135）

server {
    listen 80;
    server_name hrms.think4u-tech.com;

    # 病假附件等上傳上限
    client_max_body_size 20m;

    access_log /var/log/nginx/hrms.access.log;
    error_log  /var/log/nginx/hrms.error.log;

    # media（附件 / 頭像）：由 nginx 直接服務 docker bind mount 目錄
    location /media/ {
        alias /home/think4u/hrms/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
