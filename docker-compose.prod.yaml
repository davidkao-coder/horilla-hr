# Think4U HRMS — 生產部署 Compose 設定
# 用法：
#   cp .env.prod.example .env.prod
#   # 編輯 .env.prod：SECRET_KEY / DB_PASSWORD / ALLOWED_HOSTS / DAILY_VERIFICATION_CODE_SECRET
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --build

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      TIME_ZONE: "Asia/Taipei"
      LANGUAGE_CODE: "zh-hant"
      DAILY_VERIFICATION_CODE_SECRET: ${DAILY_VERIFICATION_CODE_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    command: sh ./entrypoint.sh
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  db:
    image: postgres:16-bullseye
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static-data:/app/staticfiles:ro
      - media-data:/app/media:ro
    depends_on:
      - server

  # 每日 pg_dump 備份（每天 03:00 跑一次）
  backup:
    image: postgres:16-bullseye
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "while true; do
        sleep $((3600 * 24));
        DATE=$$(date +%Y%m%d_%H%M%S);
        pg_dump -h db -U ${DB_USER} -d ${DB_NAME} > /backups/think4u_$$DATE.sql && echo \"backup: $$DATE\" || echo \"backup failed\";
        find /backups -name '*.sql' -mtime +30 -delete;
      done"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
  static-data:
